<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Youssef Owais contact phone number.">
    <meta name="theme-color" content="#0f172a">
    <title>Phone Number | Youssef Owais</title>

    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/724/724664.png" type="image/png">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #0f172a;
            --bg-secondary: #1e293b;
            --card: rgba(255, 255, 255, 0.94);
            --text: #111827;
            --muted: #64748b;
            --accent: #2563eb;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            overflow-x: hidden;
            background:
                radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.28), transparent 28%),
                radial-gradient(circle at 85% 25%, rgba(168, 85, 247, 0.25), transparent 30%),
                linear-gradient(135deg, var(--bg), var(--bg-secondary));
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.20;
            background-image: url("https://www.transparenttextures.com/patterns/stardust.png");
        }

        .card {
            position: relative;
            z-index: 1;
            width: min(100%, 430px);
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.30);
            border-radius: 24px;
            background: var(--card);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.30);
            backdrop-filter: blur(15px);
            animation: fadeUp 0.7s ease both;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--text);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        .back-icon {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid currentColor;
            border-radius: 50%;
            transition: transform 0.25s ease, background 0.25s ease;
        }

        .back:hover .back-icon {
            transform: translateX(-3px);
            background: rgba(37, 99, 235, 0.08);
        }

        h1 {
            margin: 28px 0 12px;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .subtitle {
            margin: 0 0 22px;
            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .phone-number {
            margin: 0 0 18px;
            padding: 15px 12px;
            border-radius: 14px;
            color: #fff;
            background: #111827;
            text-align: center;
            font-size: clamp(1.35rem, 6vw, 1.75rem);
            font-weight: 800;
            letter-spacing: 1px;
            user-select: all;
        }

        .btn-copy {
            width: 100%;
            min-height: 50px;
            border: 0;
            border-radius: 12px;
            color: #fff;
            background: var(--accent);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
            transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-copy:hover {
            filter: brightness(1.07);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(37, 99, 235, 0.32);
        }

        .btn-copy:active {
            transform: translateY(0);
        }

        .btn-copy:focus-visible,
        .back:focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.35);
            outline-offset: 4px;
        }

        #copy-message {
            min-height: 22px;
            margin: 12px 0 0;
            text-align: center;
            color: #15803d;
            font-size: 0.9rem;
            font-weight: 700;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(28px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            body { padding: 16px; }

            .card {
                padding: 24px 20px;
                border-radius: 20px;
            }

            h1 {
                font-size: 1.55rem;
                margin-top: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <a class="back" href="index.html" aria-label="Back to social media page">
            <span class="back-icon" aria-hidden="true">
                <i class="fa-solid fa-arrow-left"></i>
            </span>
            <span>Back</span>
        </a>

        <h1>My Number</h1>
        <p class="subtitle">You can copy my phone number below.</p>

        <p id="phone-number" class="phone-number" aria-label="Phone number">01097325420</p>

        <button id="copy-button" class="btn-copy" type="button">
            <i class="fa-regular fa-copy me-2" aria-hidden="true"></i>
            Copy My Number
        </button>

        <p id="copy-message" role="status" aria-live="polite"></p>
    </main>

    <script>
        const copyButton = document.getElementById("copy-button");
        const phoneNumber = document.getElementById("phone-number");
        const copyMessage = document.getElementById("copy-message");

        copyButton.addEventListener("click", async () => {
            const number = phoneNumber.textContent.trim();

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(number);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = number;
                    textArea.style.position = "fixed";
                    textArea.style.opacity = "0";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    document.execCommand("copy");
                    textArea.remove();
                }

                copyMessage.textContent = "The number has been copied!";
                copyButton.innerHTML = '<i class="fa-solid fa-check me-2" aria-hidden="true"></i>Copied!';

                setTimeout(() => {
                    copyMessage.textContent = "";
                    copyButton.innerHTML = '<i class="fa-regular fa-copy me-2" aria-hidden="true"></i>Copy My Number';
                }, 1800);
            } catch (error) {
                copyMessage.textContent = "Unable to copy. Please select the number manually.";
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
